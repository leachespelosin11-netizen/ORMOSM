<style>
  :root{
    --ink:#0f1b24;
    --hull:#0a2540;
    --hull-2:#123a5e;
    --paper:#f4f7f7;
    --card:#ffffff;
    --line:#e0e6e7;
    --line-soft:#edf1f1;
    --manifest:#0f9179;
    --manifest-deep:#0b6b58;
    --manifest-soft:#e1f4ef;
    --ok:#2f8562;
    --ok-soft:#e5f3ec;
    --warn:#c2453f;
    --warn-soft:#fbe9e8;
    --ink-soft:#5c6b73;
    --ink-faint:#93a3aa;
    --mono: "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --display: "Manrope","Inter",sans-serif;
    --sans: "Inter","Helvetica Neue",Arial,sans-serif;
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(20,29,46,0.05), 0 1px 3px rgba(20,29,46,0.06);
    --shadow-md: 0 4px 14px rgba(20,29,46,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;}
  .sidebar{background:var(--hull);color:#dce6f0;padding:20px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{padding:0 20px 16px 20px;border-bottom:1px solid #263650;margin-bottom:8px;}
  .brand .mark{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--manifest);text-transform:uppercase;}
  .brand h1{font-family:var(--display);font-size:19px;line-height:1.25;margin:6px 0 0 0;font-weight:800;color:#fff;letter-spacing:-0.01em;}
  .brand .sub{font-size:11.5px;color:#8ea3ba;margin-top:4px;font-weight:500;}
  nav{display:flex;flex-direction:column;padding:8px 10px;gap:2px;}
  nav button{
    all:unset;cursor:pointer;padding:10px 12px;font-size:13px;font-weight:600;color:#aebdd0;
    display:flex;align-items:center;gap:10px;border-radius:var(--r-sm);
  }
  nav button .num{font-family:var(--mono);font-size:10.5px;color:#5c748f;width:16px;font-weight:500;}
  nav button:hover{background:#1f2f49;color:#fff;}
  nav button.active{background:var(--manifest);color:#fff;}
  nav button.active .num{color:rgba(255,255,255,.75);}
  .sidebar-foot{margin-top:auto;padding:14px 20px;border-top:1px solid #263650;}
  .role-switch{display:flex;flex-direction:column;gap:6px;}
  .role-switch label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#5c748f;}
  .role-switch select{background:#1f2f49;color:#fff;border:1px solid #2c4a6e;border-radius:var(--r-sm);padding:7px 8px;font-size:12.5px;font-family:var(--sans);}
  .role-note{font-size:10.5px;color:#7c8ba0;margin-top:8px;line-height:1.5;}
  main{padding:30px clamp(20px,4vw,40px) 60px;max-width:1280px;}
  h2.page-title{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-0.01em;margin:0 0 4px 0;}
  .page-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;}
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);border-radius:var(--r-md);padding:14px 16px;position:relative;}
  .kpi .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .kpi .val{font-family:var(--display);font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-0.01em;}
  .kpi .val.accent{color:var(--manifest-deep);}
  .kpi .val.small{font-size:15px;font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;}
  .card h3{font-family:var(--display);font-weight:700;font-size:15px;margin:0 0 12px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;letter-spacing:-0.005em;}
  .card h3 small{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);font-weight:400;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:7px 8px;border-bottom:1px solid var(--line);}
  td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tr.total td{font-weight:700;border-top:2px solid var(--ink);background:#faf9f6;}
  .num-cell{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-family:var(--mono);white-space:nowrap;font-weight:500;}
  .pill.blue{background:#e5edf5;color:var(--hull-2);}
  .pill.amber{background:var(--manifest-soft);color:var(--manifest-deep);}
  .pill.green{background:var(--ok-soft);color:var(--ok);}
  .pill.red{background:var(--warn-soft);color:var(--warn);}
  .pill.gray{background:#eeece6;color:#666;}
  .btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--hull);color:#fff;padding:9px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:600;line-height:1;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);}
  .btn:hover{background:var(--hull-2);}
  .btn.ghost{background:none;color:var(--hull);border:1px solid var(--line);}
  .btn.ghost:hover{background:#f4f2ec;}
  .btn.warn{background:var(--warn);}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn.xs{padding:5px 9px;font-size:11.5px;border-radius:6px;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
  .field label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  .field input, .field select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;font-family:var(--sans);background:#fff;height:36px;}
  .field input[type=number]{font-family:var(--mono);}
  .field input[disabled],.field select[disabled]{background:#f4f2ec;color:#8b8f96;}
  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
  .grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .grid-5{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .flag-note{font-size:12px;color:var(--warn);background:var(--warn-soft);border:1px solid #f3d6d4;padding:9px 12px;border-radius:var(--r-sm);margin-bottom:14px;}
  .info-note{font-size:12px;color:var(--ink-soft);background:#f4f1ea;border:1px solid var(--line);padding:9px 12px;border-radius:var(--r-sm);margin-bottom:14px;}
  .empty{color:var(--ink-soft);font-size:12.5px;padding:20px 0;text-align:center;}
  .shipment-list-item{border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;border-radius:var(--r-md);cursor:pointer;background:#fff;transition:border-color .12s;}
  .shipment-list-item:hover{border-color:var(--manifest);}
  .shipment-list-item.active{border-color:var(--manifest);background:var(--manifest-soft);}
  .shipment-list-item .title{font-weight:700;font-size:13px;font-family:var(--display);}
  .shipment-list-item .meta{font-size:11px;color:var(--ink-soft);margin-top:3px;font-family:var(--mono);}
  .list-actions{display:flex;gap:4px;margin-top:8px;}
  .icon-btn{all:unset;cursor:pointer;color:var(--warn);font-size:11px;font-family:var(--sans);font-weight:600;}
  .icon-btn[disabled]{opacity:.3;cursor:not-allowed;}
  .bar-track{background:var(--line-soft);height:7px;border-radius:4px;overflow:hidden;display:flex;}
  .bar-seg{height:100%;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;font-family:var(--mono);}
  .legend span.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;}
  .sim-diff{font-family:var(--mono);font-size:12px;}
  .sim-diff.up{color:var(--warn);}
  .sim-diff.down{color:var(--ok);}
  .phase-track{display:flex;gap:4px;margin:8px 0 4px 0;}
  .phase-step{flex:1;height:6px;border-radius:3px;background:#e6e3da;}
  .phase-step.done{background:var(--ok);}
  .phase-step.current{background:var(--manifest);}
  .phase-label{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .alert-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
  .alert-item:last-child{border-bottom:none;}
  .alert-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .alert-dot.red{background:var(--warn);}
  .alert-dot.amber{background:var(--manifest);}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;}
  .status-dot.green{background:var(--ok);}
  .status-dot.red{background:var(--warn);}
  .status-dot.amber{background:var(--manifest);}
  .dash-ship-row{cursor:pointer;transition:background-color .1s;}
  .dash-ship-row:hover{background:var(--manifest-soft);}
  .diff-badge{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500;}
  .diff-badge.up{background:var(--warn-soft);color:var(--warn);}
  .diff-badge.down{background:var(--ok-soft);color:var(--ok);}
  .diff-badge.flat{background:#eeece6;color:#666;}
  /* --- compact actions / menus --- */
  .actions-cell{display:flex;gap:4px;align-items:center;justify-content:flex-end;position:relative;}
  .menu-wrap{position:relative;display:inline-block;}
  .kebab-btn{all:unset;cursor:pointer;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--ink-soft);font-size:15px;line-height:1;}
  .kebab-btn:hover{background:var(--line-soft);color:var(--ink);}
  .menu-dropdown{position:absolute;right:0;top:30px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-md);border-radius:var(--r-md);min-width:180px;z-index:40;padding:5px;}
  .menu-dropdown button{all:unset;display:block;width:100%;box-sizing:border-box;padding:8px 10px;font-size:12.5px;border-radius:6px;cursor:pointer;color:var(--ink);}
  .menu-dropdown button:hover{background:var(--line-soft);}
  .menu-dropdown button.danger{color:var(--warn);}
  .menu-dropdown .menu-sep{height:1px;background:var(--line-soft);margin:4px 2px;}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;align-items:center;}
  /* --- responsive --- */
  @media (max-width: 1080px){
    .app{grid-template-columns:76px 1fr;}
    .brand h1, .brand .sub, nav button span:not(.num), .sidebar-foot{display:none;}
    .brand{padding:0 0 14px 0;text-align:center;}
    .brand .mark{display:none;}
    nav{align-items:center;}
    nav button{justify-content:center;padding:12px;}
    main{padding:22px 16px 50px;}
    .grid-kpi{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width: 700px){
    .grid-kpi, .grid-3, .grid-4, .grid-5, .grid-2{grid-template-columns:1fr;}
    table{font-size:11.5px;}
  }
  /* --- auth / RBAC --- */
  .hidden{display:none !important;}
  #auth-screen{min-height:100vh;display:none;align-items:center;justify-content:center;background:var(--hull);padding:20px;}
  .auth-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:32px 30px;width:100%;max-width:380px;}
  .auth-brand{text-align:center;margin-bottom:22px;}
  .auth-logo{width:64px;height:64px;object-fit:contain;margin-bottom:10px;}
  .brand-logo-chip{background:#fff;border-radius:var(--r-md);width:56px;height:56px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .brand-logo-chip img{width:40px;height:40px;object-fit:contain;}
  .auth-brand .mark{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--manifest);text-transform:uppercase;}
  .auth-brand h1{font-family:var(--display);font-size:20px;font-weight:800;margin:6px 0 0 0;color:var(--ink);letter-spacing:-0.01em;}
  .auth-brand .sub{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .user-menu .user-name{font-weight:700;font-size:13px;color:#fff;}
  .user-menu .user-role{font-family:var(--mono);font-size:10.5px;color:#8ea3ba;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
</style>
</head>

async function loadState(){
  try{
    if(HAS_ENV_STORAGE){
      const res = await window.storage.get(STORE_KEY, false);
      if(res && res.value){ STATE = JSON.parse(res.value); }
    } else {
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) STATE = JSON.parse(raw);
    }
  }catch(e){ /* not found / corrupted */ }
  if(!STATE){
    STATE = seedState();
    const wcsp = wcSiennaPragaSeedData();
    STATE.products.push(...wcsp.products);
    STATE.shipments.push(wcsp.shipment);
    await saveState();
    return;
  }
  // Migración suave: si el estado guardado es de antes del sistema de usuarios, no lo pisamos —
  // solo completamos lo que falte, para no perder embarques/productos ya capturados.
  if(!Array.isArray(STATE.users) || !STATE.users.length){ STATE.users = seedState().users; }
  if(!('session' in STATE)) STATE.session = null;
  // Migración aditiva: agrega el embarque W.C. Sienna / W.C. Praga si todavía no existe, sin
  // tocar ningún producto/embarque/dato que ya esté capturado.
  if(!STATE.shipments.some(sh=>sh.id==='s_wcsienna_praga')){
    const wcsp = wcSiennaPragaSeedData();
    wcsp.products.forEach(p=>{ if(!STATE.products.some(x=>x.id===p.id)) STATE.products.push(p); });
    STATE.shipments.push(wcsp.shipment);
  }
  await saveState();
}
async function saveState(){
  try{
    if(HAS_ENV_STORAGE) await window.storage.set(STORE_KEY, JSON.stringify(STATE), false);
    else localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
  }catch(e){ console.error('storage error', e); }
}

/* =========================================================
   AUTENTICACIÓN Y CONTROL DE ACCESO POR ROLES (RBAC)
   -----------------------------------------------------------
   IMPORTANTE: esta app es 100% cliente (sin backend/API propios), por decisión
   explícita del usuario. Eso significa que esto es control de acceso de
   INTERFAZ, no un perímetro de seguridad real: cualquiera con las herramientas
   de desarrollador del navegador puede leer este código, ver los hashes y
   saltarse estas comprobaciones. Las contraseñas se guardan hasheadas
   (SHA-256 + salt) para no exponerlas en texto plano, pero eso NO equivale a
   seguridad real de producción — para eso se necesita backend + base de datos
   (ver README "Qué falta para producción").
========================================================= */
const ROLES = {
  socio: { label:'Socio', views:['dashboard','shipments','payments','simulator'], canWrite:false },
  admin: { label:'Administrador', views:['dashboard','products','suppliers','forwarders','shipments','payments','params','simulator','users'], canWrite:true },
};
const SESSION_TTL_MS = 30*60*1000; // 30 min de inactividad

function currentUser(){
  if(!STATE.session) return null;
  const u = (STATE.users||[]).find(x=>x.id===STATE.session.userId);
  return (u && u.active!==false) ? u : null;
}
function currentRoleDef(){ const u=currentUser(); return u ? ROLES[u.role] : null; }
function isAdmin(){ return currentRoleDef()? currentRoleDef().canWrite===true : false; }
function dis(){ return isAdmin() ? '' : 'disabled'; }
function canAccessView(view){ const r=currentRoleDef(); return !!r && r.views.includes(view); }
function isSessionValid(){ return !!STATE.session && Date.now() < STATE.session.expiresAt; }
function expireSessionIfNeeded(){
  if(STATE.session && !isSessionValid()){ STATE.session = null; saveState(); }
}
function touchSession(){ if(STATE.session) STATE.session.expiresAt = Date.now()+SESSION_TTL_MS; }

async function sha256Hex(str){
  const data = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function genSalt(){ return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function hashPassword(password, salt){ return sha256Hex(salt+':'+password); }
function generateTempPassword(len=12){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(n=>chars[n % chars.length]).join('');
}

let loginError = '';
let pwChangeError = '';
let loginBusy = false;

async function attemptLogin(email, password){
  loginBusy = true;
  const u = (STATE.users||[]).find(x=>x.email.toLowerCase()===String(email||'').trim().toLowerCase());
  if(!u || u.active===false){ loginError='Correo o contraseña incorrectos.'; loginBusy=false; return; }
  const h = await hashPassword(password, u.salt);
  loginBusy = false;
  if(h !== u.passwordHash){ loginError='Correo o contraseña incorrectos.'; return; }
  loginError='';
  STATE.session = { userId: u.id, expiresAt: Date.now()+SESSION_TTL_MS };
  await saveState();
  navigateTo(u.mustChangePassword ? 'login' : 'dashboard', true);
}
async function logout(){
  STATE.session = null;
  await saveState();
  navigateTo('login', true);
}
async function completePasswordChange(newPw, confirmPw){
  const u = currentUser();
  if(!u) return;
  if(!newPw || newPw.length<8){ pwChangeError='La contraseña debe tener al menos 8 caracteres.'; render(); return; }
  if(newPw !== confirmPw){ pwChangeError='Las contraseñas no coinciden.'; render(); return; }
  const salt = genSalt();
  u.salt = salt;
  u.passwordHash = await hashPassword(newPw, salt);
  u.mustChangePassword = false;
  pwChangeError='';
  await saveState();
  navigateTo('dashboard', true);
}

/* =========================================================
   MOTOR DE CÁLCULO
========================================================= */
function computeCore(fobTotal, items, costItems, taxParams, allocationMethod, extraCosts, exchangeRate){
  extraCosts = extraCosts||[];
  const amounts = {};
  costItems.forEach(ci=>{
    let amt = 0;
    if(ci.basis==='flat') amt = ci.rate;
    else if(['per_container','per_hbl','per_piece'].includes(ci.basis)) amt = ci.rate*ci.qty;
    else if(ci.basis==='pct_fob') amt = ci.rate*fobTotal;
    amounts[ci.id] = amt;
  });
  const cifComponents = costItems.filter(ci=> ci.includeInCIF && ['flat','per_container','per_hbl','per_piece','pct_fob'].includes(ci.basis));
  const cifExtra = cifComponents.reduce((a,ci)=>a+amounts[ci.id],0);
  const cif = fobTotal + cifExtra;
  costItems.forEach(ci=>{ if(ci.basis==='pct_cif') amounts[ci.id] = ci.rate*cif; });
  const igi = taxParams.igi*cif;
  const dta = taxParams.dta*cif;
  const ivaBase = cif+igi+dta;
  const iva = taxParams.iva*ivaBase;
  const taxesTotal = igi+dta+iva;
  costItems.forEach(ci=>{ if(ci.basis==='pct_taxes') amounts[ci.id] = ci.rate*taxesTotal; });

  const baseLogistics = costItems.reduce((a,ci)=> ci.isRealExpense===false ? a : a+(amounts[ci.id]||0), 0);

  const toUSD = ec => ec.currency==='MXN' ? ec.amount/(exchangeRate||1) : ec.amount;
  const extraGeneral = extraCosts.filter(ec=>!ec.productId).reduce((a,ec)=>a+toUSD(ec),0);
  const extraByProduct = {};
  extraCosts.filter(ec=>ec.productId).forEach(ec=>{ extraByProduct[ec.productId] = (extraByProduct[ec.productId]||0) + toUSD(ec); });
  const extraTotal = extraGeneral + Object.values(extraByProduct).reduce((a,v)=>a+v,0);

  const logisticsTotal = baseLogistics + extraTotal;
  const landedTotal = fobTotal + logisticsTotal + taxesTotal;

  let basisFn;
  if(allocationMethod==='qty') basisFn = it=>it.qty;
  else if(allocationMethod==='weight') basisFn = it=>(it.weight||0)*it.qty;
  else if(allocationMethod==='manual') basisFn = it=> (it.manualPct||0);
  else basisFn = it=> it.qty*it.fobUnit;

  const basisTotal = items.reduce((a,it)=>a+basisFn(it),0) || 1;
  const perProduct = items.map(it=>{
    const share = basisFn(it)/basisTotal;
    const fob = it.qty*it.fobUnit;
    const logistics = baseLogistics*share + extraGeneral*share + (extraByProduct[it.productId]||0);
    const taxes = taxesTotal*share;
    const total = fob+logistics+taxes;
    return { itemId: it.id, productId: it.productId, qty: it.qty, fobUnit: it.fobUnit,
      share, fob, logistics, taxes, total, unitCost: it.qty? total/it.qty : 0 };
  });

  return { fobTotal, amounts, cif, igi, dta, iva, taxesTotal, baseLogistics, extraTotal, logisticsTotal, landedTotal, perProduct, cifExtra };
}

function computeShipment(sh){
  const fobTotal = sh.items.reduce((a,it)=>a + it.qty*it.fobUnit, 0);
  const real = computeCore(fobTotal, sh.items, sh.costItems, sh.taxParams, sh.allocationMethod, sh.extraCosts, sh.exchangeRate);

  let estimated;
  if(sh.estimateSnapshot){
    estimated = sh.estimateSnapshot;
  } else {
    estimated = computeCore(fobTotal, sh.items, sh.costItems, sh.taxParams, sh.allocationMethod, [], sh.exchangeRate);
  }
  const diff = real.landedTotal - estimated.landedTotal;
  const diffPct = estimated.landedTotal ? (diff/estimated.landedTotal*100) : 0;

  return { ...real, estimated, diff, diffPct };
}

function fmt(n, d=2){ return (n||0).toLocaleString('es-MX', {minimumFractionDigits:d, maximumFractionDigits:d}); }
function usd(n){ return '$'+fmt(n)+' USD'; }
function mxn(n){ return '$'+fmt(n)+' MXN'; }
function pct(n){ return (n>=0?'+':'')+fmt(n,1)+'%'; }
function diffBadge(diff, diffPct){
  const cls = Math.abs(diff)<0.01 ? 'flat' : (diff>0?'up':'down');
  return `<span class="diff-badge ${cls}">${diff>=0?'+':''}${usd(diff)} (${pct(diffPct)})</span>`;
}

function downloadReportPDF(shId){
  const sh = STATE.shipments.find(s=>s.id===shId);
  if(!sh) return;
  const html = buildReportHTML(sh);
  const w = window.open('', '_blank');
  if(!w){ alert('El navegador bloqueó la ventana emergente. Habilítala para descargar el reporte.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 350);
}

function downloadReportExcel(shId){
  const sh = STATE.shipments.find(s=>s.id===shId);
  if(!sh) return;
  const r = computeShipment(sh);
  const productName = pid => (STATE.products.find(p=>p.id===pid)||{}).name || '—';

  const wsInfo = XLSX.utils.aoa_to_sheet([
    ['Reporte de embarque', sh.number],
    ['Proveedor', sh.supplierName],
    ['Fecha', sh.date],
    ['Contenedores', `${sh.containers} × ${sh.containerType}`],
    ['Incoterm', sh.incoterm],
    ['Puerto origen', sh.originPort],
    ['Puerto destino', sh.destPort],
    ['BL/HBL', sh.blNumber||''],
    ['ETA', sh.eta||''],
    ['Fase actual', PHASES[sh.phase]],
  ]);
  const wsFin = XLSX.utils.aoa_to_sheet([
    ['Concepto','Importe USD'],
    ['Valor mercancía (FOB)', r.fobTotal],
    ...sh.costItems.map(ci=>[ci.name, r.amounts[ci.id]||0]),
    ['IGI', r.igi], ['DTA', r.dta], ['IVA', r.iva],
    ['Costo total estimado', r.estimated.landedTotal],
    ['Costo total real', r.landedTotal],
    ['Diferencia', r.diff],
  ]);
  const wsExtra = XLSX.utils.aoa_to_sheet([
    ['Concepto','Categoría','Monto','Moneda','Fecha'],
    ...(sh.extraCosts||[]).map(ec=>[ec.concept, ec.category, ec.amount, ec.currency, ec.date])
  ]);
  const wsProd = XLSX.utils.aoa_to_sheet([
    ['Producto','SKU','Cantidad','FOB unit.','Costo est. unit.','Costo real unit.','Costo total'],
    ...sh.items.map(it=>{
      const real = r.perProduct.find(x=>x.itemId===it.id);
      const est = r.estimated.perProduct.find(x=>x.itemId===it.id) || real;
      return [productName(it.productId), (STATE.products.find(p=>p.id===it.productId)||{}).sku, it.qty, it.fobUnit, est.unitCost, real.unitCost, real.total];
    })
  ]);
  const wsPay = XLSX.utils.aoa_to_sheet([
    ['Concepto','%','Monto','Vencimiento','Estatus'],
    ...(sh.payments||[]).map(p=>[paymentLabel(p), p.pct, p.amount, p.dueDate, p.status])
  ]);
  const wsPhase = XLSX.utils.aoa_to_sheet([
    ['Fase','Fecha'],
    ...(sh.phaseLog||[]).map(pl=>[`Fase ${pl.phase} — ${PHASES[pl.phase]}`, pl.date])
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsInfo, 'Info general');
  XLSX.utils.book_append_sheet(wb, wsFin, 'Financiero');
  XLSX.utils.book_append_sheet(wb, wsExtra, 'Costos extra');
  XLSX.utils.book_append_sheet(wb, wsProd, 'Productos');
  XLSX.utils.book_append_sheet(wb, wsPay, 'Pagos');
  XLSX.utils.book_append_sheet(wb, wsPhase, 'Fases');
  XLSX.writeFile(wb, `Reporte_${sh.number.replace(/[^a-z0-9]+/gi,'_')}.xlsx`);
}

/* =========================================================
   ALERTAS
========================================================= */
function computeAlerts(){
  const alerts = [];
  const cfg = STATE.alertConfig;
  const today = todayStr();
  STATE.shipments.forEach(sh=>{
    (sh.payments||[]).forEach(p=>{
      if(p.status==='pendiente'){
        const d = daysBetween(today, p.dueDate);
        if(d < 0) alerts.push({level:'red', text:`Pago vencido: "${paymentLabel(p)}" de ${sh.number} (${sh.supplierName}) — venció hace ${Math.abs(d)} día(s).`});
        else if(d <= cfg.paymentSoonDays) alerts.push({level:'amber', text:`Pago próximo: "${paymentLabel(p)}" de ${sh.number} en ${d} día(s) — ${usd(p.amount)}.`});
      }
    });
    const daysInPhase = daysBetween(sh.phaseEnteredAt||sh.date, today);
    if(daysInPhase > cfg.phaseMaxDays && sh.phase < 4){
      alerts.push({level:'amber', text:`${sh.number} lleva ${daysInPhase} días en fase "${PHASES[sh.phase]}" (umbral: ${cfg.phaseMaxDays}).`});
    }
    const r = computeShipment(sh);
    if(r.diff > 0.01){
      alerts.push({level:'red', text:`${sh.number}: costo real superó el estimado por ${usd(r.diff)} (${pct(r.diffPct)}).`});
    }
    (sh.extraCosts||[]).forEach(ec=>{
      if(ec.amount >= cfg.extraCostThreshold){
        alerts.push({level:'amber', text:`Costo extraordinario en ${sh.number}: "${ec.concept}" por ${ec.currency==='MXN'?mxn(ec.amount):usd(ec.amount)}.`});
      }
    });
  });
  return alerts;
}

function attachAuthHandlers(){
  const form = document.getElementById('login-form');
  if(form) form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const pw = document.getElementById('login-password').value;
    await attemptLogin(email, pw);
    render();
  });
  const cform = document.getElementById('change-password-form');
  if(cform) cform.addEventListener('submit', async (e)=>{
    e.preventDefault();
    await completePasswordChange(document.getElementById('new-password').value, document.getElementById('confirm-password').value);
  });
  const cancelBtn = document.getElementById('btn-cancel-pw-change');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=> logout());
}

function render(){
  expireSessionIfNeeded();
  const authScreen = document.getElementById('auth-screen');
  const appShell = document.getElementById('app-shell');
  const u = currentUser();

  if(!u){
    loginBusy = false;
    appShell.classList.add('hidden');
    authScreen.style.display = 'flex';
    authScreen.innerHTML = renderLogin();
    attachAuthHandlers();
    return;
  }
  if(u.mustChangePassword){
    appShell.classList.add('hidden');
    authScreen.style.display = 'flex';
    authScreen.innerHTML = renderChangePassword(u);
    attachAuthHandlers();
    return;
  }

  touchSession(); saveState();
  authScreen.style.display = 'none';
  appShell.classList.remove('hidden');
  document.getElementById('nav').innerHTML = renderNav(u);
  renderSidebarFoot(u);

  const main = document.getElementById('main');
  if(!canAccessView(currentView)){
    main.innerHTML = render403();
    attachHandlers();
    return;
  }
  if(currentView==='dashboard') main.innerHTML = renderDashboard();
  else if(currentView==='products') main.innerHTML = renderProducts();
  else if(currentView==='suppliers') main.innerHTML = renderDirectory('suppliers');
  else if(currentView==='forwarders') main.innerHTML = renderDirectory('forwarders');
  else if(currentView==='shipments') main.innerHTML = renderShipments();
  else if(currentView==='payments') main.innerHTML = renderPayments();
  else if(currentView==='params') main.innerHTML = renderParams();
  else if(currentView==='simulator') main.innerHTML = renderSimulator();
  else if(currentView==='users') main.innerHTML = renderUsers();
  attachHandlers();
}

function renderDashboard(){
  const results = STATE.shipments.map(sh=>({sh, r: computeShipment(sh)}));
  const totalFOB = results.reduce((a,x)=>a+x.r.fobTotal,0);
  const totalLog = results.reduce((a,x)=>a+x.r.logisticsTotal,0);
  const totalTax = results.reduce((a,x)=>a+x.r.taxesTotal,0);
  const totalRealLanded = results.reduce((a,x)=>a+x.r.landedTotal,0);
  const totalEstLanded = results.reduce((a,x)=>a+x.r.estimated.landedTotal,0);
  const nContainers = STATE.shipments.reduce((a,s)=>a+s.containers,0);
  const phaseCounts = [0,0,0,0,0];
  STATE.shipments.forEach(s=>{ phaseCounts[s.phase] = (phaseCounts[s.phase]||0) + s.containers; });
  const productUnitRows = results.flatMap(({sh,r})=> r.perProduct.map(pp=>{
    const est = r.estimated.perProduct.find(x=>x.itemId===pp.itemId) || pp;
    const prod = STATE.products.find(p=>p.id===pp.productId);
    return { productName: prod?prod.name:'—', shipmentNumber: sh.number, estUnit: est.unitCost, realUnit: pp.unitCost };
  }));

  // Próximo pago
  const pending = [];
  STATE.shipments.forEach(sh=>{
    (sh.payments||[]).filter(p=>p.status==='pendiente').forEach(p=>{
      pending.push({ sh, p, days: daysBetween(todayStr(), p.dueDate) });
    });
  });
  pending.sort((a,b)=>a.days-b.days);
  const nextPay = pending[0];

  const alerts = computeAlerts();

  const segs = [
    {label:'Mercancía', val: totalFOB, color:'#183353'},
    {label:'Logística', val: totalLog, color:'#c07a3e'},
    {label:'Impuestos', val: totalTax, color:'#b23b3b'},

/* ---------- PRODUCTOS ---------- */
function renderProducts(){
  const rows = STATE.products.map(p=>{
    const history = [];
    STATE.shipments.forEach(sh=>{
      sh.items.filter(it=>it.productId===p.id).forEach(it=>{
        const r = computeShipment(sh);
        const ppReal = r.perProduct.find(x=>x.itemId===it.id);
        const ppEst = r.estimated.perProduct.find(x=>x.itemId===it.id) || ppReal;
        history.push({date: sh.date, shipment: sh.number, supplier: sh.supplierName, fobUnit: it.fobUnit,
          estUnit: ppEst?ppEst.unitCost:0, realUnit: ppReal?ppReal.unitCost:0});
      });
    });
    const latest = history[history.length-1];
    return {p, history, latest};
  });

  return `
    <h2 class="page-title">Catálogo de productos</h2>
    <div class="page-sub">Comparación rápida y evolución de costo estimado vs. real por embarque</div>

    <div class="card">
      <h3>Comparación general
        <span class="row">
          <button class="btn small" id="btn-add-product" ${dis()}>+ Agregar producto</button>
          <button class="btn small ghost" id="btn-import-excel" ${dis()}>Importar Excel</button>
          <input type="file" id="excel-file-input" accept=".xlsx,.xls" style="display:none" ${dis()}/>
        </span>
      </h3>
      <table>
        <tr><th>Nombre</th><th>SKU</th><th>Fracción</th><th>Proveedor</th><th class="num-cell">Precio FOB</th><th class="num-cell">Costo GDL aprox.</th><th class="num-cell">Costo real</th><th>Estado</th><th></th></tr>
        ${rows.map(({p,latest})=>{
          const menuId = 'prod-'+p.id;
          const hasHist = productHasHistory(p.id);
          const isArchived = p.status==='archived';
          const fobDisplay = latest ? latest.fobUnit : (p.refFobUnit||'');
          return `
          <tr style="${isArchived?'opacity:.55':''}">
            <td><input data-prod-field="name" data-prod-id="${p.id}" value="${p.name}" ${dis()} style="min-width:150px"/></td>
            <td><input data-prod-field="sku" data-prod-id="${p.id}" value="${p.sku}" ${dis()} style="width:110px"/></td>
            <td><input data-prod-field="fraction" data-prod-id="${p.id}" value="${p.fraction||''}" ${dis()} style="width:100px"/></td>
            <td><select data-prod-field="supplier" data-prod-id="${p.id}" ${dis()}>
              <option value="">(sin asignar)</option>
              ${STATE.suppliers.filter(s=>s.status!=='inactive' || s.name===p.supplier).map(s=>`<option value="${s.name}" ${s.name===p.supplier?'selected':''}>${s.name}</option>`).join('')}
              ${p.supplier && !STATE.suppliers.some(s=>s.name===p.supplier) ? `<option value="${p.supplier}" selected>${p.supplier} (sin registrar)</option>` : ''}
            </select></td>
            <td class="num-cell">
              ${latest
                ? usd(latest.fobUnit)
                : `<input type="number" step="0.01" data-prod-field="refFobUnit" data-prod-id="${p.id}" value="${p.refFobUnit||''}" placeholder="0.00" ${dis()} style="width:80px"/>`}
            </td>
            <td class="num-cell">${latest?usd(latest.estUnit):'—'}</td>
            <td class="num-cell">${latest?usd(latest.realUnit):'—'}</td>
            <td><span class="pill ${isArchived?'gray':'green'}">${isArchived?'Archivado':'Activo'}</span></td>
            <td class="actions-cell">
              ${isAdmin() ? `<button class="btn xs ghost" data-save-product="${p.id}">Guardar</button>${saveFlashBadge('prod-'+p.id)}` : ''}
              <div class="menu-wrap">
                <button class="kebab-btn" data-menu-toggle="${menuId}">⋯</button>
                <div class="menu-dropdown" style="display:${openMenu===menuId?'block':'none'}">
                  <button data-view-history="${p.id}">Ver historial</button>
                  ${isAdmin() ? `
                    <button data-toggle-status="${p.id}">${isArchived?'Reactivar':'Desactivar'}</button>
                    <div class="menu-sep"></div>
                    <button class="danger" data-delete-product="${p.id}">Eliminar</button>
                  ` : ''}
                </div>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </table>
      ${isAdmin() ? `<div class="info-note" style="margin-top:12px;margin-bottom:0;">Los cambios se guardan automáticamente al salir de cada campo. El botón "Guardar" es solo una confirmación explícita.</div>` : ''}
    </div>

    ${rows.map(({p,history})=>`
      <div class="card" id="product-history-${p.id}">
        <h3>${p.name} <small>${p.sku} · ${p.fraction||'sin fracción'} · ${p.supplier||'sin proveedor'}</small></h3>
        ${history.length? `
        <table>
          <tr><th>Fecha</th><th>Embarque</th><th class="num-cell">Precio FOB</th><th class="num-cell">Costo estimado</th><th class="num-cell">Costo real</th></tr>
          ${history.map(h=>`<tr><td>${h.date}</td><td>${h.shipment}</td><td class="num-cell">${usd(h.fobUnit)}</td><td class="num-cell">${usd(h.estUnit)}</td><td class="num-cell">${usd(h.realUnit)}</td></tr>`).join('')}
        </table>` : `<div class="empty">Sin movimientos registrados todavía.</div>`}
      </div>
    `).join('')}
  `;
}

/* ---------- PAGOS ---------- */
function renderPayments(){
  const rows = [];
  STATE.shipments.forEach(sh=>{
    (sh.payments||[]).forEach(p=>{
      const productNames = sh.items.map(it=>(STATE.products.find(pr=>pr.id===it.productId)||{}).name).join(', ');
      rows.push({sh, p, productNames});
    });
  });
  rows.sort((a,b)=> (a.p.status==='pendiente'?0:1) - (b.p.status==='pendiente'?0:1) || new Date(a.p.dueDate)-new Date(b.p.dueDate));

  return `
    <h2 class="page-title">Pagos a proveedores</h2>
    <div class="page-sub">Estado de anticipos y saldos por embarque</div>
    <div class="card">
      <table>

        ${rows.map(({sh,p,productNames})=>{
          const d = daysBetween(todayStr(), p.dueDate);
          const overdue = p.status==='pendiente' && d<0;
          return `<tr>
            <td>${sh.supplierName}</td>
            <td>${sh.number}</td>
            <td>${paymentLabel(p)}</td>
            <td>${productNames}</td>
            <td class="num-cell">${usd(p.amount)}</td>
            <td>${p.dueDate}</td>
            <td><span class="pill ${p.status==='pagado'?'green':(overdue?'red':'amber')}">${p.status==='pagado'?'Pagado':(overdue?'Vencido':'Pendiente')}</span></td>

        }).join('')}
      </table>
    </div>
  `;
}

/* ---------- SIMULADOR ---------- */
function renderSimulator(){
  if(!selectedShipmentId && STATE.shipments.length) selectedShipmentId = STATE.shipments[0].id;
  const base = STATE.shipments.find(s=>s.id===selectedShipmentId);
  if(!base) return '<div class="empty">Registra un embarque primero.</div>';

  const o = simOverrides;
  const sim = JSON.parse(JSON.stringify(base));
  if(o.exchangeRate!=null) sim.exchangeRate = o.exchangeRate;
  if(o.igi!=null) sim.taxParams.igi = o.igi;
  if(o.freightAmount!=null){
    const oceanBase = base.costItems.find(b=>b.code==='OCEAN');
    sim.costItems.forEach(ci=>{ if(ci.code==='OCEAN'){ const perUnit = o.freightAmount/(ci.qty||1); ci.rate = perUnit; } });
  }
  if(o.containers!=null){
    sim.containers = o.containers;
    sim.costItems.forEach(ci=>{ if(ci.basis==='per_container') ci.qty = o.containers; });
  }
  if(o.fobUnit!=null && sim.items[0]){
    sim.items.forEach(it=>{ it.fobUnit = o.fobUnit; });
  }
  if(o.extraAmount!=null){
    sim.extraCosts = [...sim.extraCosts, {id:'sim-extra', concept:'Ajuste simulado', category:'Otro', amount:o.extraAmount, currency:'USD', date: todayStr(), productId:null}];
  }

  const rBase = computeShipment(base);
  const rSim = computeShipment(sim);
  const diffTotal = rSim.landedTotal - rBase.landedTotal;

  const productName = pid => (STATE.products.find(p=>p.id===pid)||{}).name || '—';
  const oceanItem = base.costItems.find(c=>c.code==='OCEAN');
  const currentFreight = oceanItem ? oceanItem.rate*oceanItem.qty : 0;
  const currentFOB = base.items[0] ? base.items[0].fobUnit : 0;

  return `
    <h2 class="page-title">Simulador de escenarios</h2>
    <div class="page-sub">Cambios aquí son temporales — nunca modifican los datos oficiales del embarque</div>

    <div class="card">
      <h3>Embarque base: ${base.number}</h3>
      <div class="grid-3">
        <div class="field"><label>Tipo de cambio (actual ${base.exchangeRate})</label><input type="number" step="0.01" id="sim-fx" value="${o.exchangeRate ?? base.exchangeRate}"/></div>
        <div class="field"><label>IGI (actual ${(base.taxParams.igi*100).toFixed(1)}%)</label><input type="number" step="0.001" id="sim-igi" value="${o.igi ?? base.taxParams.igi}"/></div>
        <div class="field"><label>Contenedores (actual ${base.containers})</label><input type="number" id="sim-cnt" value="${o.containers ?? base.containers}"/></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Flete marítimo total — monto directo (actual ${usd(currentFreight)})</label><input type="number" step="1" id="sim-freight-amt" value="${o.freightAmount ?? currentFreight}"/></div>
        <div class="field"><label>Precio FOB del proveedor — monto directo (actual ${usd(currentFOB)})</label><input type="number" step="0.01" id="sim-fob-amt" value="${o.fobUnit ?? currentFOB}"/></div>
      </div>
      <div class="field"><label>Costo adicional a simular (USD)</label><input type="number" step="1" id="sim-extra-amt" value="${o.extraAmount ?? 0}"/></div>
      <button class="btn" id="btn-run-sim">Recalcular escenario</button>
      <button class="btn ghost" id="btn-reset-sim">Restablecer</button>
    </div>

    <div class="card">
      <h3>Flete: real vs. simulado</h3>
      <table>
        <tr><td>Flete real</td><td class="num-cell">${usd(currentFreight)}</td></tr>
        <tr><td>Flete simulado</td><td class="num-cell">${usd(o.freightAmount ?? currentFreight)}</td></tr>
        <tr class="total"><td>Diferencia</td><td class="num-cell">${diffBadge((o.freightAmount ?? currentFreight)-currentFreight,0)}</td></tr>
      </table>
    </div>

    <div class="card">
      <h3>Precio proveedor: real vs. simulado</h3>
      <table>
        <tr><td>FOB actual</td><td class="num-cell">${usd(currentFOB)}</td></tr>
        <tr><td>FOB simulado</td><td class="num-cell">${usd(o.fobUnit ?? currentFOB)}</td></tr>
        <tr class="total"><td>Diferencia por unidad</td><td class="num-cell">${diffBadge((o.fobUnit ?? currentFOB)-currentFOB,0)}</td></tr>
      </table>
    </div>

    <div class="card">
      <h3>Comparación combinada</h3>
      <table>
        <tr><th></th><th class="num-cell">Actual</th><th class="num-cell">Simulado</th><th class="num-cell">Diferencia</th></tr>
        <tr><td>Valor mercancía FOB</td><td class="num-cell">${usd(rBase.fobTotal)}</td><td class="num-cell">${usd(rSim.fobTotal)}</td><td class="num-cell">${diffBadge(rSim.fobTotal-rBase.fobTotal,0)}</td></tr>
        <tr><td>Logística</td><td class="num-cell">${usd(rBase.logisticsTotal)}</td><td class="num-cell">${usd(rSim.logisticsTotal)}</td><td class="num-cell">${diffBadge(rSim.logisticsTotal-rBase.logisticsTotal,0)}</td></tr>
        <tr><td>Impuestos</td><td class="num-cell">${usd(rBase.taxesTotal)}</td><td class="num-cell">${usd(rSim.taxesTotal)}</td><td class="num-cell">${diffBadge(rSim.taxesTotal-rBase.taxesTotal,0)}</td></tr>
        <tr class="total"><td>COSTO UNITARIO (prom. embarque)</td><td class="num-cell">${usd(rBase.landedTotal/(base.items.reduce((a,i)=>a+i.qty,0)||1))}</td><td class="num-cell">${usd(rSim.landedTotal/(sim.items.reduce((a,i)=>a+i.qty,0)||1))}</td><td class="num-cell">${diffBadge((rSim.landedTotal/(sim.items.reduce((a,i)=>a+i.qty,0)||1))-(rBase.landedTotal/(base.items.reduce((a,i)=>a+i.qty,0)||1)),0)}</td></tr>
        <tr class="total"><td>COSTO TOTAL PUESTO EN DESTINO</td><td class="num-cell">${usd(rBase.landedTotal)}</td><td class="num-cell">${usd(rSim.landedTotal)}</td><td class="num-cell">${diffBadge(diffTotal,0)}</td></tr>
      </table>
    </div>

    <div class="card">
      <h3>Costo unitario por producto — escenario</h3>
      <table>
        <tr><th>Producto</th><th class="num-cell">Costo actual</th><th class="num-cell">Costo simulado</th><th class="num-cell">Diferencia</th></tr>
        ${rSim.perProduct.map((pp,i)=>{
          const b = rBase.perProduct[i];
          const d = pp.unitCost-b.unitCost;
          return `<tr><td>${productName(pp.productId)}</td><td class="num-cell">${usd(b.unitCost)}</td><td class="num-cell">${usd(pp.unitCost)}</td><td class="num-cell">${diffBadge(d,0)}</td></tr>`;
        }).join('')}
      </table>
    </div>
  `;
}

/* =========================================================
   HANDLERS
========================================================= */
function attachHandlers(){
  const btnLogout = document.getElementById('btn-logout');
  if(btnLogout) btnLogout.addEventListener('click', ()=> logout());

  const btnGoDash = document.getElementById('btn-go-dashboard');
  if(btnGoDash) btnGoDash.addEventListener('click', ()=> navigateTo('dashboard'));

  // Usuarios (solo admin — la vista misma ya está protegida por canAccessView)
  document.querySelectorAll('[data-toggle-user-active]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const u = STATE.users.find(x=>x.id===el.dataset.toggleUserActive);
      if(!u) return;
      if(u.id===currentUser().id){ alert('No puedes desactivar tu propia cuenta.'); return; }
      u.active = u.active===false ? true : false;
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-reset-user-pw]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const u = STATE.users.find(x=>x.id===el.dataset.resetUserPw);
      if(!u) return;
      const tempPw = generateTempPassword();
      const salt = genSalt();
      u.salt = salt;
      u.passwordHash = await hashPassword(tempPw, salt);
      u.mustChangePassword = true;
      await saveState(); render();
      alert(`Nueva contraseña temporal para ${u.name}:\n\n${tempPw}\n\nCompártela de forma segura. No queda guardada en ningún lugar ni se puede volver a mostrar.`);
    });
  });

  // Menús desplegables (⋯)
  document.querySelectorAll('[data-menu-toggle]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); toggleMenu(el.dataset.menuToggle); });
  });
  if(openMenu){
    document.addEventListener('click', function closeMenuOnce(){
      openMenu = null; render(); document.removeEventListener('click', closeMenuOnce);
    }, {once:true});
  }

  // Reportes
  document.querySelectorAll('[data-report-pdf]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); downloadReportPDF(el.dataset.reportPdf); openMenu=null; render(); });
  });
  document.querySelectorAll('[data-report-xlsx]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); downloadReportExcel(el.dataset.reportXlsx); openMenu=null; render(); });
  });

  document.querySelectorAll('[data-select-shipment]').forEach(el=>{
    el.addEventListener('click', ()=>{ selectedShipmentId = el.dataset.selectShipment; render(); });
  });
  document.querySelectorAll('[data-goto-shipment]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!canAccessView('shipments')) return;
      selectedShipmentId = el.dataset.gotoShipment;
      navigateTo('shipments');
    });
  });

  const btnNew = document.getElementById('btn-new-shipment');
  if(btnNew) btnNew.addEventListener('click', async ()=>{
    if(!isAdmin()) return;
    const id = uid('s');
    STATE.shipments.push({
      id, number:'Nuevo embarque', supplierName:'', forwarder:'', orderRefs:'',
      originPort:'', destPort:'', incoterm:'FOB', containers:1, containerType:"40'HQ",
      blNumber:'', eta:'',
      exchangeRate: 18.0, date: todayStr(), phase:0, phaseEnteredAt: todayStr(),
      phaseLog: [{phase:0, date: todayStr()}],
      taxParams: {...STATE.taxParams}, allocationMethod:'fob', items:[], costItems:[],
      extraCosts:[], payments:[], estimateSnapshot:null
    });
    selectedShipmentId = id;
    await saveState(); render();
  });

  document.querySelectorAll('[data-del-shipment]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===el.dataset.delShipment);
      if(!confirm(`¿Eliminar el embarque "${sh?sh.number:''}"? Esta acción no se puede deshacer.`)) return;
      STATE.shipments = STATE.shipments.filter(s=>s.id!==el.dataset.delShipment);
      selectedShipmentId = STATE.shipments[0]?.id || null;
      openMenu = null;
      await saveState(); render();
    });
  });

  document.querySelectorAll('[data-sh-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      const field = el.dataset.shField;
      let val = el.value;
      if(['containers','exchangeRate','phase'].includes(field)) val = parseFloat(val);
      if(field==='phase' && val!==sh.phase){
        sh.phaseEnteredAt = todayStr();
        sh.phaseLog = sh.phaseLog||[];
        sh.phaseLog.push({phase: val, date: todayStr()});
      }
      sh[field] = val;
      await saveState(); render();
    });
  });

  document.querySelectorAll('[data-item-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      const it = sh.items.find(i=>i.id===el.dataset.itemId);
      const field = el.dataset.itemField;
      let val = el.value;
      if(['qty','fobUnit','weight'].includes(field)) val = parseFloat(val)||0;
      it[field] = val;
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-add-item]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===el.dataset.addItem);
      const firstProduct = STATE.products[0];
      sh.items.push({id:uid('i'), productId: firstProduct?firstProduct.id:'', qty:0, fobUnit:0, weight:0});
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-del-item]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      sh.items = sh.items.filter(i=>i.id!==el.dataset.delItem);
      await saveState(); render();
    });
  });

  document.querySelectorAll('[data-cost-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      const ci = sh.costItems.find(c=>c.id===el.dataset.costId);
      const field = el.dataset.costField;
      let val = el.value;
      if(field==='includeInCIF' || field==='isRealExpense') val = el.checked;
      else if(['rate','qty'].includes(field)) val = parseFloat(val)||0;
      ci[field] = val;
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-add-cost]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===el.dataset.addCost);
      sh.costItems.push({id:uid('c'), name:'Nuevo concepto', code:'NEW', basis:'flat', rate:0, qty:1, includeInCIF:false});
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-del-cost]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      sh.costItems = sh.costItems.filter(c=>c.id!==el.dataset.delCost);
      await saveState(); render();
    });
  });

  // Costos extra
  document.querySelectorAll('[data-extra-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      const ec = sh.extraCosts.find(e=>e.id===el.dataset.extraId);
      const field = el.dataset.extraField;
      let val = el.value;
      if(field==='amount') val = parseFloat(val)||0;
      if(field==='productId' && val==='') val = null;
      ec[field] = val;
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-add-extra]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===el.dataset.addExtra);
      sh.extraCosts = sh.extraCosts||[];
      sh.extraCosts.push({id:uid('x'), concept:'Nuevo costo', category:'Otro', amount:0, currency:'USD', date: todayStr(), productId:null, notes:''});
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-del-extra]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      sh.extraCosts = sh.extraCosts.filter(e=>e.id!==el.dataset.delExtra);
      await saveState(); render();
    });
  });

  // Pagos
  document.querySelectorAll('[data-payment-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      const p = sh.payments.find(x=>x.id===el.dataset.paymentId);
      const field = el.dataset.paymentField;
      let val = el.value;
      if(field==='amount') val = parseFloat(val)||0;
      if(field==='pct') val = (parseFloat(val)||0)/100;
      if(field==='status'){ p.paidDate = val==='pagado'? todayStr() : null; }
      p[field] = val;
      if(field==='concept' || field==='pct'){
        const meta = PAYMENT_CONCEPTS[p.concept] || PAYMENT_CONCEPTS.otro;
        if(meta.base){
          const r = computeShipment(sh);
          p.amount = p.pct * paymentBaseValue(r, meta.base);
        }
      }
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-add-payment]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===el.dataset.addPayment);
      sh.payments = sh.payments||[];
      sh.payments.push({id:uid('pay'), concept:'otro', pct:0, amount:0, dueDate: todayStr(), paidDate:null, status:'pendiente'});
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-del-payment]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const sh = STATE.shipments.find(s=>s.id===selectedShipmentId);
      sh.payments = sh.payments.filter(p=>p.id!==el.dataset.delPayment);
      await saveState(); render();
    });
  });

  // Congelar estimado
  const btnFreeze = document.getElementById('btn-freeze-estimate');
  if(btnFreeze) btnFreeze.addEventListener('click', async ()=>{
    if(!isAdmin()) return;
    const sh = STATE.shipments.find(s=>s.id===btnFreeze.dataset.freeze);
    const fobTotal = sh.items.reduce((a,it)=>a+it.qty*it.fobUnit,0);
    sh.estimateSnapshot = computeCore(fobTotal, sh.items, sh.costItems, sh.taxParams, sh.allocationMethod, [], sh.exchangeRate);
    await saveState(); render();
  });

  // Parámetros
  const btnParams = document.getElementById('btn-save-params');
  if(btnParams) btnParams.addEventListener('click', async ()=>{
    if(!isAdmin()) return;
    STATE.taxParams = {
      igi: parseFloat(document.getElementById('param-igi').value)||0,
      dta: parseFloat(document.getElementById('param-dta').value)||0,
      iva: parseFloat(document.getElementById('param-iva').value)||0,
      insurancePct: parseFloat(document.getElementById('param-ins').value)||0,
    };
    await saveState(); render();
  });
  const btnAlertCfg = document.getElementById('btn-save-alertcfg');
  if(btnAlertCfg) btnAlertCfg.addEventListener('click', async ()=>{
    if(!isAdmin()) return;
    STATE.alertConfig = {
      phaseMaxDays: parseFloat(document.getElementById('param-phasedays').value)||10,
      paymentSoonDays: parseFloat(document.getElementById('param-paydays').value)||5,
      extraCostThreshold: parseFloat(document.getElementById('param-extrathresh').value)||500,
    };
    await saveState(); render();
  });
  ['btn-add-product','btn-add-product-2'].forEach(id=>{
    const btn = document.getElementById(id);
    if(btn) btn.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      STATE.products.push({id:uid('p'), sku:'NUEVO-SKU', name:'Nuevo producto', supplier:'', fraction:'', uom:'pza', status:'active'});
      await saveState(); render();
    });
  });

  document.querySelectorAll('[data-prod-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      if(!isAdmin()) return;
      const p = STATE.products.find(x=>x.id===el.dataset.prodId);
      if(!p) return;
      const field = el.dataset.prodField;
      let val = el.value;
      if(field==='refFobUnit') val = parseFloat(val)||0;
      p[field] = val;
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-save-product]').forEach(el=>{
    el.addEventListener('click', ()=> saveWithFlash('prod-'+el.dataset.saveProduct));
  });
  document.querySelectorAll('[data-save-dir]').forEach(el=>{
    el.addEventListener('click', ()=> saveWithFlash('dir-'+el.dataset.saveDir.replace(':','-')));
  });
  document.querySelectorAll('[data-save-shipment]').forEach(el=>{
    el.addEventListener('click', ()=> saveWithFlash('ship-'+el.dataset.saveShipment));
  });

  document.querySelectorAll('[data-view-history]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      openMenu = null; render();
      setTimeout(()=>{
        const card = document.getElementById('product-history-'+el.dataset.viewHistory);
        if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
      }, 30);
    });
  });
  document.querySelectorAll('[data-toggle-status]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!isAdmin()) return;
      const p = STATE.products.find(x=>x.id===el.dataset.toggleStatus);
      p.status = p.status==='archived' ? 'active' : 'archived';
      openMenu = null;
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-delete-product]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!isAdmin()) return;
      const p = STATE.products.find(x=>x.id===el.dataset.deleteProduct);
      if(!p) return;
      if(productHasHistory(p.id)){
        if(confirm(`"${p.name}" está usado en uno o más embarques y no puede eliminarse sin perder historial.\n\n¿Deseas marcarlo como INACTIVO en su lugar?`)){
          p.status = 'archived';
          await saveState();
        }
      } else {
        if(confirm(`¿Estás seguro de que deseas eliminar "${p.name}"? Esta acción no se puede deshacer.`)){
          STATE.products = STATE.products.filter(x=>x.id!==p.id);
          await saveState();
        }
      }
      openMenu = null; render();
    });
  });

  // Proveedores / Forwarders
  document.querySelectorAll('[data-add-directory]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const kind = el.dataset.addDirectory;
      STATE[kind].push({id:uid('d'), name:'Nuevo '+(kind==='suppliers'?'proveedor':'forwarder'), country:'', contact:'', phone:'', email:'', address:'', notes:'', status:'active'});
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-dir-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      if(!isAdmin()) return;
      const kind = el.dataset.dirKind;
      const item = STATE[kind].find(x=>x.id===el.dataset.dirId);
      item[el.dataset.dirField] = el.value;
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-toggle-dir-status]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!isAdmin()) return;
      const [kind, id] = el.dataset.toggleDirStatus.split(':');
      const item = STATE[kind].find(x=>x.id===id);
      item.status = item.status==='inactive' ? 'active' : 'inactive';
      openMenu = null;
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-delete-dir]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!isAdmin()) return;
      const [kind, id] = el.dataset.deleteDir.split(':');
      const item = STATE[kind].find(x=>x.id===id);
      const inUse = kind==='forwarders'
        ? STATE.shipments.some(sh=>sh.forwarder===item.name)
        : STATE.shipments.some(sh=>sh.supplierName===item.name);
      if(inUse){
        if(confirm(`"${item.name}" está usado en uno o más embarques. ¿Deseas marcarlo como INACTIVO en su lugar?`)){
          item.status = 'inactive';
          await saveState();
        }
      } else if(confirm(`¿Eliminar "${item.name}"? Esta acción no se puede deshacer.`)){
        STATE[kind] = STATE[kind].filter(x=>x.id!==id);
        await saveState();
      }
      openMenu = null; render();
    });
  });

  // Importar Excel
  const btnImport = document.getElementById('btn-import-excel');
  const fileInput = document.getElementById('excel-file-input');
  if(btnImport && fileInput){
    btnImport.addEventListener('click', ()=>{ if(isAdmin()) fileInput.click(); });
    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (evt)=>{
        try{
          const wb = XLSX.read(evt.target.result, {type:'binary'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws);
          rows.forEach(row=>{
            STATE.products.push({
              id: uid('p'),
              sku: row.SKU || row.sku || 'SKU-'+uid(''),
              name: row.Nombre || row.nombre || row.Producto || 'Producto importado',
              supplier: row.Proveedor || row.proveedor || '',
              fraction: row.Fraccion || row['Fracción'] || row.fraccion || '',
              uom: row.UOM || row.uom || 'pza',
              status: 'active'
            });
          });
          await saveState(); render();
        }catch(err){ alert('No se pudo leer el archivo. Verifica columnas: SKU, Nombre, Proveedor, Fracción.'); }
      };
      reader.readAsBinaryString(file);
    });
  }

  // Simulador
  const btnRun = document.getElementById('btn-run-sim');
  if(btnRun) btnRun.addEventListener('click', ()=>{
    simOverrides = {
      exchangeRate: parseFloat(document.getElementById('sim-fx').value),
      igi: parseFloat(document.getElementById('sim-igi').value),
      containers: parseFloat(document.getElementById('sim-cnt').value),
      freightAmount: parseFloat(document.getElementById('sim-freight-amt').value),
      fobUnit: parseFloat(document.getElementById('sim-fob-amt').value),
      extraAmount: parseFloat(document.getElementById('sim-extra-amt').value) || null,
    };
    render();
  });
  const btnReset = document.getElementById('btn-reset-sim');
  if(btnReset) btnReset.addEventListener('click', ()=>{ simOverrides = {}; render(); });
}

/* =========================================================
   BOOT
========================================================= */
(async function boot(){
  await loadState();
  expireSessionIfNeeded();
  currentView = viewFromPath(location.pathname);
  render();
})();
</script>
</body>
</html>
